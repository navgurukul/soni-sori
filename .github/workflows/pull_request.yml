# Triggers the workflow on push or pull request events but only for the main branch

name: Pull Request Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: 17
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create local.properties 
        shell: bash
        run: |
          touch ./local.properties
          echo "⚙️ Creating a new local.properties file"
          echo "sdk.dir=ANDROID_SDK_ROOT" > ./local.properties

      - name: Create google-services.json placeholders
        shell: bash
        run: |
          echo "⚙️ Creating dummy google-services.json files"
          DUMMY_JSON='{
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-id",
              "storage_bucket": "dummy-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:123456789abc",
                  "android_client_info": {
                    "package_name": "org.merakilearn"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }'
          echo "$DUMMY_JSON" > ./app/google-services.json
          echo "$DUMMY_JSON" > ./typing/google-services.json

      - name: 📦 Build the app
        run: ./gradlew app:assembleDebug

      - name: 🧹 Check Lint
        run: ./gradlew app:lint
      
      - name: 🧪 Run tests
        run: ./gradlew app:test
